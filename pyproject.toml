[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solomon-llm-shield"
version = "2.0.5"
description = "Enterprise-grade LLM security guardrail library for protecting input prompts and output responses"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Solomon AI Security" , email = "suleiman.agabayew@gmail.com" }
]
keywords = [
    "llm",
    "security",
    "guardrail",
    "ai-safety",
    "prompt-injection",
    "data-leakage",
    "pii-detection",
    "content-moderation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/solomon-ai-security/solomon-llm-shield"
Documentation = "https://github.com/solomon-ai-security/solomon-llm-shield#readme"
Repository = "https://github.com/solomon-ai-security/solomon-llm-shield"
Issues = "https://github.com/solomon-ai-security/solomon-llm-shield/issues"

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["solomon_llm_shield"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
